[build]
command = "npm run generate"
publish = "dist"

[build.environment]
NODE_VERSION = "20.14.0"

# Send the old Netlify subdomain to the real domain so search engines only
# index one copy of the site.
[[redirects]]
  from = "https://lot-standard-co.netlify.app/*"
  to = "https://lotstandard.com/:splat"
  status = 301
  force = true

# Fingerprinted build assets never change - cache them for a year (Core Web Vitals)
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimised images (/_ipx/*) are WebP data saved under .jpg/.png names, so
# label them as WebP. The cache is 7 days rather than a year because the file
# name stays the same when a photo is replaced.
[[headers]]
  for = "/_ipx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/webp"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/area-photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo-icon-mark.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
